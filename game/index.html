<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberlight — Keeper of the Last Lantern</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1026'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23ffd76a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff3c4'/%3E%3C/svg%3E">
<style>

    left: -9999px;

    height: 1px;

  }

<body>
<canvas id="game" width="1280" height="720"></canvas>
<p id="status" aria-live="polite">Emberlight — Keeper of the Last Lantern. Press Enter to start.</p>

</html>
