<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberlight — Keeper of the Last Lantern</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0d1026;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }
  #status {
    position: fixed;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<p id="status" aria-live="polite">Emberlight — Keeper of the Last Lantern. Press Enter to start.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
